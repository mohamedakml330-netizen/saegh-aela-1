<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سعر الدولار اليوم</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Tahoma,Arial;
    text-align:center;
}

.header{
    background:gold;
    color:black;
    padding:20px;
    font-size:25px;
    font-weight:bold;
}

.box{
    background:#222;
    margin:30px auto;
    padding:25px;
    width:80%;
    max-width:400px;
    border-radius:15px;
    box-shadow:0 0 15px #000;
}

.price{
    font-size:30px;
    color:#00ff88;
    margin:15px;
}

.time{
    color:#aaa;
    font-size:14px;
}

</style>

</head>

<body>


<div class="header">
💵 سعر الدولار اليوم
</div>


<div class="box">

<h2>شراء</h2>
<div class="price" id="buy">جاري التحميل...</div>


<h2>بيع</h2>
<div class="price" id="sell">جاري التحميل...</div>


<div class="time" id="update"></div>


</div>



<script>


async function updateDollar(){

try{


let response = await fetch(
"https://api.frankfurter.app/latest?from=USD&to=EGP"
);


let data = await response.json();


let price = data.rates.EGP;


// فرق قريب من فرق البنوك
let buy = price - 0.15;
let sell = price + 0.15;



document.getElementById("buy").innerHTML =
buy.toFixed(2) + " جنيه";


document.getElementById("sell").innerHTML =
sell.toFixed(2) + " جنيه";



document.getElementById("update").innerHTML =
"آخر تحديث: " + new Date().toLocaleString("ar-EG");


}

catch(error){

document.getElementById("buy").innerHTML =
"خطأ في التحميل";

document.getElementById("sell").innerHTML =
"خطأ في التحميل";

}

}



updateDollar();


setInterval(updateDollar,60000);


</script>


</body>
</html>
