<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سعر الدولار</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Tahoma,Arial,sans-serif;
    text-align:center;
}

.header{
    background:gold;
    color:black;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.card{
    margin:40px auto;
    width:320px;
    background:#222;
    border:1px solid gold;
    border-radius:12px;
    padding:20px;
}

#price{
    font-size:32px;
    color:gold;
    margin:20px 0;
}
</style>

</head>

<body>

<div class="header">💵 سعر الدولار</div>

<div class="card">
<h2>الدولار الأمريكي</h2>

<div id="price">جاري التحميل...</div>

<button onclick="getPrice()">تحديث</button>
</div>

<script>
async function getPrice() {
    document.getElementById("price").innerText = "جاري التحميل...";

    try {
        const response = await fetch("https://open.er-api.com/v6/latest/USD");
        const data = await response.json();

        if (data && data.rates && data.rates.EGP) {
            document.getElementById("price").innerText =
                data.rates.EGP.toFixed(2) + " جنيه";
        } else {
            document.getElementById("price").innerText =
                "تعذر جلب السعر";
        }
    } catch (e) {
        document.getElementById("price").innerText =
            "خطأ في الاتصال";
    }
}

getPrice();
</script>

</body>
</html>
