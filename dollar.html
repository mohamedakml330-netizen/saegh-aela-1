<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سعر الدولار - صائغ العيلة</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Tahoma,Arial;
    text-align:center;
}

.header{
    background:gold;
    color:black;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.card{
    margin:40px auto;
    width:320px;
    background:#222;
    border:1px solid gold;
    border-radius:12px;
    padding:20px;
}

.buy{
    color:#00ff66;
    font-size:25px;
}

.sell{
    color:#ff5555;
    font-size:25px;
}

.update{
    color:#aaa;
    margin-top:15px;
}
</style>

</head>

<body>

<div class="header">
💵 سعر الدولار
</div>

<div class="card">

<h2>الدولار الأمريكي 🇺🇸</h2>

<p class="buy" id="buy">
🟢 شراء: جاري التحميل...
</p>

<p class="sell" id="sell">
🔴 بيع: جاري التحميل...
</p>

<p class="update" id="time">
آخر تحديث: ---
</p>

</div>


<script>

function updateDollar(){

// مؤقتًا مكان مصدر السعر
let buy = "50.00";
let sell = "50.50";


document.getElementById("buy").innerHTML =
"🟢 شراء: " + buy + " جنيه";

document.getElementById("sell").innerHTML =
"🔴 بيع: " + sell + " جنيه";


document.getElementById("time").innerHTML =
"آخر تحديث: " + new Date().toLocaleTimeString();

}


// تحديث تلقائي كل دقيقة
updateDollar();
setInterval(updateDollar,60000);


</script>

</body>
</html>
