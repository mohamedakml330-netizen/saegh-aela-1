<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدولار | صائغ العيلة</title>

<style>
body{
margin:0;
background:#0b0b0b;
font-family:Tahoma,Arial;
color:#fff;
text-align:center;
}

.header{
background:#111;
padding:20px;
border-bottom:2px solid gold;
}

.header h1{
color:gold;
margin:0;
}

.card{
width:90%;
max-width:500px;
margin:30px auto;
background:#181818;
border:2px solid gold;
border-radius:15px;
padding:25px;
}

.price{
font-size:45px;
font-weight:bold;
color:#00ff88;
margin:20px 0;
}

.time{
color:#bbb;
font-size:15px;
}

button{
margin-top:20px;
padding:12px 25px;
font-size:18px;
background:gold;
border:none;
border-radius:8px;
cursor:pointer;
}

.ad{
width:90%;
max-width:500px;
margin:20px auto;
border:2px dashed gold;
padding:20px;
border-radius:12px;
}

footer{
margin:30px;
color:#888;
}
</style>

</head>

<body>

<div class="header">
<h1>💵 صائغ العيلة</h1>
<p>سعر الدولار مقابل الجنيه المصري</p>
</div>

<div class="card">

<h2>الدولار الأمريكي</h2>

<div id="price" class="price">
جاري التحميل...
</div>

<div id="time" class="time"></div>

<button onclick="loadPrice()">
تحديث
</button>

</div>

<div class="ad">
📞 للإعلان<br>
01125325171
</div>

<footer>
© 2026 صائغ العيلة
</footer>

<script>

async function loadPrice(){

document.getElementById("price").innerHTML="جاري التحميل...";

try{

const res = await fetch("https://api.frankfurter.dev/v2/rates?base=USD&quotes=EGP");

const data = await res.json();

if(Array.isArray(data) && data.length>0){

const price=data[0].rate;

document.getElementById("price").innerHTML=
price.toFixed(2)+" جنيه";

document.getElementById("time").innerHTML=
"آخر تحديث: "+data[0].date;

}else{

document.getElementById("price").innerHTML="لا توجد بيانات";

}

}catch(e){

document.getElementById("price").innerHTML="فشل تحميل السعر";
console.log(e);

}

}

loadPrice();

setInterval(loadPrice,60000);

</script>

</body>
</html>
