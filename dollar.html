<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الدولار | صائغ العيلة</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
text-align:center;
}

header{
background:#111;
padding:20px;
border-bottom:2px solid #d4af37;
}

header h1{
color:#d4af37;
font-size:32px;
}

header p{
color:#ccc;
margin-top:8px;
}

.box{
width:90%;
max-width:500px;
margin:30px auto;
background:#181818;
border:2px solid #d4af37;
border-radius:15px;
padding:25px;
}

.price{
font-size:45px;
font-weight:bold;
color:#00ff88;
margin:20px 0;
}

.time{
color:#aaa;
font-size:15px;
margin-top:15px;
}

.refresh{
margin-top:20px;
background:#d4af37;
color:#000;
border:none;
padding:12px 25px;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.refresh:hover{
background:#f0c64b;
}

.ad{
width:90%;
max-width:500px;
margin:20px auto;
border:2px dashed #d4af37;
padding:20px;
border-radius:15px;
font-size:18px;
}

footer{
margin-top:35px;
padding:20px;
color:#888;
}
</style>

</head>

<body>

<header>
<h1>💵 صائغ العيلة</h1>
<p>سعر الدولار الأمريكي مقابل الجنيه المصري</p>
</header>

<div class="box">

<h2>الدولار الأمريكي</h2>

<div class="price" id="price">
جاري التحميل...
</div>

<div class="time" id="time">
...
</div>

<button class="refresh" onclick="loadPrice()">
تحديث الآن
</button>

</div>

<div class="ad">
📞 للإعلان الاتصال على<br><br>
01125325171
</div>

<footer>
© 2026 صائغ العيلة - By Akml Mohamed
</footer>

<script>

async function loadPrice(){

try{

const response = await fetch("https://api.frankfurter.dev/v2/rates?base=USD&quotes=EGP");

const data = await response.json();

let price = data[0].rate;

document.getElementById("price").innerHTML =
price.toFixed(2)+" جنيه";

document.getElementById("time").innerHTML =
"آخر تحديث : "+new Date().toLocaleString("ar-EG");

}catch(error){

document.getElementById("price").innerHTML="فشل تحميل السعر";

console.log(error);

}

}

loadPrice();

setInterval(loadPrice,60000);

</script>

</body>
</html>
