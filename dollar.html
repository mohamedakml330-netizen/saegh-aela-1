<div id="price">جاري التحميل...</div>

<script>
window.onload = function () {
    getPrice();
};

async function getPrice(){
    try{
        const res = await fetch("https://open.er-api.com/v6/latest/USD");
        const data = await res.json();

        let price = data.rates.EGP;

        // فرق بسيط للسوق المصري
        price = price + 0.5;

        document.getElementById("price").innerText =
            price.toFixed(2) + " جنيه (سوق مصر)";
    }
    catch(e){
        document.getElementById("price").innerText =
            "حصل خطأ في جلب السعر";
    }
}
</script>
