<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدولار | صائغ العيلة</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
text-align:center;
}

.header{
background:#111;
padding:20px;
border-bottom:2px solid gold;
}

.header h1{
color:gold;
font-size:32px;
}

.header p{
color:#bbb;
margin-top:8px;
}

.card{
width:90%;
max-width:500px;
margin:30px auto;
background:#181818;
border:2px solid gold;
border-radius:15px;
padding:25px;
}

.title{
font-size:22px;
margin-bottom:20px;
}

.price{
font-size:50px;
font-weight:bold;
color:#00ff88;
margin:20px 0;
}

.time{
color:#bbb;
font-size:15px;
margin-top:15px;
}

button{
margin-top:20px;
padding:12px 30px;
background:gold;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.ad{
width:90%;
max-width:500px;
margin:20px auto;
padding:20px;
border:2px dashed gold;
border-radius:12px;
font-size:18px;
}

footer{
margin:30px;
color:#888;
}
</style>

</head>

<body>

<div class="header">
<h1>💵 صائغ العيلة</h1>
<p>سعر الدولار الأمريكي مقابل الجنيه المصري</p>
</div>

<div class="card">

<div class="title">
الدولار الأمريكي
</div>

<div id="price" class="price">
جاري التحميل...
</div>

<div id="time" class="time"></div>

<button onclick="loadPrice()">
تحديث
</button>

</div>

<div class="ad">
📞 للإعلان<br>
01125325171
</div>

<footer>
© 2026 صائغ العيلة - By Akml Mohamed
</footer>

<script>

async function loadPrice(){

const price=document.getElementById("price");
const time=document.getElementById("time");

price.innerHTML="جاري التحميل...";

try{

const response=await fetch("https://api.frankfurter.dev/v2/rate/USD/EGP");

if(!response.ok){
throw new Error("API Error");
}

const data=await response.json();

price.innerHTML=Number(data.rate).toFixed(2)+" جنيه";

time.innerHTML="آخر تحديث: "+data.date;

}catch(error){

console.log(error);

price.innerHTML="فشل تحميل السعر";

time.innerHTML="";

}

}

window.onload=loadPrice;

setInterval(loadPrice,60000);

</script>

</body>
</html>
