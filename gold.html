<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أسعار الذهب اليوم</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Tahoma,Arial;
    text-align:center;
}

.header{
    background:gold;
    color:black;
    padding:20px;
    font-size:25px;
    font-weight:bold;
}

.box{
    background:#222;
    margin:25px auto;
    padding:20px;
    width:85%;
    max-width:400px;
    border-radius:15px;
}

.price{
    color:#ffd700;
    font-size:25px;
    margin:12px;
}

#update{
    color:#aaa;
    font-size:14px;
}
</style>

</head>

<body>

<div class="header">
🪙 أسعار الذهب اليوم
</div>

<div class="box">

<h2>عيار 24</h2>
<div class="price" id="g24">جاري التحميل...</div>

<h2>عيار 21</h2>
<div class="price" id="g21">جاري التحميل...</div>

<h2>عيار 18</h2>
<div class="price" id="g18">جاري التحميل...</div>

<div id="update"></div>

</div>


<script>

async function goldPrice(){

try{

let res = await fetch(
"https://api.metals.live/v1/spot/gold"
);

let data = await res.json();

let ounce = data[0].price;


// تحويل أونصة إلى جرام
let gram24 = ounce / 31.1035;


// تحويل دولار لجنيه (تقدر تغيره بسعر الدولار عندك)
let dollar = 50;

let gold24 = gram24 * dollar;

let gold21 = gold24 * 0.875;

let gold18 = gold24 * 0.75;


document.getElementById("g24").innerHTML =
gold24.toFixed(0)+" جنيه";

document.getElementById("g21").innerHTML =
gold21.toFixed(0)+" جنيه";

document.getElementById("g18").innerHTML =
gold18.toFixed(0)+" جنيه";


document.getElementById("update").innerHTML =
"آخر تحديث: "+new Date().toLocaleString("ar-EG");

}

catch(e){

document.getElementById("g24").innerHTML="تعذر التحميل";

}

}

goldPrice();

setInterval(goldPrice,60000);

</script>

</body>
</html>
