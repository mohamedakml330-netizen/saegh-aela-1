<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دهب</title>

<style>
body{
margin:0;
background:#0d0d0d;
color:white;
font-family:Tahoma,Arial;
}

.header{
background:linear-gradient(45deg,#b8860b,#ffd700);
color:#111;
padding:25px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
padding:15px;
}

.card{
background:#1c1c1c;
border:1px solid #8f6b00;
border-radius:18px;
padding:15px;
margin:15px 0;
}

.title{
color:#ffd700;
font-size:22px;
margin-bottom:10px;
}

.price{
font-size:24px;
font-weight:bold;
}

.buy{
color:#00e676;
}

.sell{
color:#ff5252;
}

.row{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid #333;
}

.update{
text-align:center;
color:#aaa;
font-size:14px;
}
</style>

</head>

<body>

<div class="header">
🪙 تطبيق دهب
</div>

<div class="container">

<div class="card">
<div class="title">أسعار الذهب</div>

<div class="row">
<span>عيار 24</span>
<span id="g24">--</span>
</div>

<div class="row">
<span>عيار 21</span>
<span id="g21">--</span>
</div>

<div class="row">
<span>عيار 18</span>
<span id="g18">--</span>
</div>

<div class="row">
<span>عيار 14</span>
<span id="g14">--</span>
</div>

</div>


<div class="card">
<div class="title">الذهب الخام</div>

<div class="row">
<span>جنيه ذهب</span>
<span id="coin">--</span>
</div>

<div class="row">
<span>نصف جنيه</span>
<span id="half">--</span>
</div>

<div class="row">
<span>أونصة</span>
<span id="ounce">--</span>
</div>

</div>


<div class="card">

<div class="title">السوق</div>

<p class="buy">شراء: <span id="buy">--</span></p>

<p class="sell">بيع: <span id="sell">--</span></p>

</div>


<div class="update" id="time">
جاري التحديث...
</div>

</div>


<script>

async function gold(){

try{

let r=await fetch(https://api.metals.live/v1/spot/gold);
let d=await r.json();

let ounceDollar=d[0].price;

let dollar=50;

let g24=(ounceDollar/31.1035)*dollar;

let g21=g24*0.875;
let g18=g24*0.75;
let g14=g24*0.583;


document.getElementById("g24").innerHTML=g24.toFixed(0)+" جنيه";
document.getElementById("g21").innerHTML=g21.toFixed(0)+" جنيه";
document.getElementById("g18").innerHTML=g18.toFixed(0)+" جنيه";
document.getElementById("g14").innerHTML=g14.toFixed(0)+" جنيه";

document.getElementById("coin").innerHTML=(g21*8).toFixed(0)+" جنيه";
document.getElementById("half").innerHTML=(g21*4).toFixed(0)+" جنيه";
document.getElementById("ounce").innerHTML=(ounceDollar*dollar).toFixed(0)+" جنيه";

document.getElementById("buy").innerHTML=(g21-50).toFixed(0)+" جنيه";
document.getElementById("sell").innerHTML=(g21+50).toFixed(0)+" جنيه";

document.getElementById("time").innerHTML=
"آخر تحديث: "+new Date().toLocaleString("ar-EG");

}catch(e){

document.getElementById("time").innerHTML="تعذر تحميل السعر";

}

}

gold();

setInterval(gold,60000);

</script>

</body>
</html>
